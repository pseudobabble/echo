name: Release Android app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK, and CMake
        uses: android-actions/setup-android@v3
      - run: sdkmanager "ndk;26.3.11579264" "cmake;3.22.1"

      # This project does not yet include a Gradle wrapper, so install the
      # version compatible with Android Gradle Plugin 8.2.2 explicitly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.2"

      - name: Build release APK
        run: gradle assembleRelease

      - name: Name release asset
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "Echo-${{ github.ref_name }}-unsigned.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: Echo-${{ github.ref_name }}-unsigned.apk
